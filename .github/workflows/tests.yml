name: Tests

"on":
  push:
  pull_request:

permissions:
  contents: read

env:
  TEMP: ${{ github.workspace }}/.tmp/codex
  TMP: ${{ github.workspace }}/.tmp/codex

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
        python-version:
          - "3.11"
          - "3.14"

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Prepare isolated temporary directory
        shell: bash
        run: mkdir -p .tmp/codex

      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt

      - name: Verify runtime and formal startup
        run: python scripts/runtime_smoke.py

      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Report browser executable
        if: runner.os == 'Linux'
        run: python -c "from tests.test_ui_high_volume import _browser_executable; print(_browser_executable())"

      - name: Run full test suite
        run: python -m pytest

      - name: Verify repository cleanliness
        shell: bash
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"
